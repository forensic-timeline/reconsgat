# Labelling Rules untuk Ground Truth Dataset
# Format:
#   - filter: list of patterns (AND condition - semua pattern harus match)
#   - Pattern matching bersifat case-insensitive

# Organization Y Labelling Rules, adapted from SEC Paper

- id: dir_scan
  ground_truth_label: dir_scan
  sensitivity: moderate
  filter:
    - " python"

- id: dir_scan
  ground_truth_label: dir_scan
  sensitivity: moderate
  filter:
    - "ShellBot"

- id: dir_scan
  ground_truth_label: dir_scan
  sensitivity: moderate
  filter:
    - "curl/8.5.0"
    
- id: bruteforce_login_server_attempt
  ground_truth_label: bruteforce_login_server_attempt
  sensitivity: moderate
  filter:
    - "authentication failure"

- id: bruteforce_login_server_attempt
  ground_truth_label: bruteforce_login_server_attempt
  sensitivity: moderate
  filter:
    - "Failed password for"

- id: bruteforce_login_server_attempt
  ground_truth_label: bruteforce_login_server_attempt
  sensitivity: moderate
  filter:
    - "invalid user"

- id: bruteforce_login_web
  ground_truth_label: bruteforce_login_web
  sensitivity: strict
  filter:
    - "%Mozilla/5.0"
    - "%/wp-login.php%"
    - "%POST%"
    - "%200%"

- id: cyberpanel_login_attempt
  ground_truth_label: cyberpanel_login_attempt
  sensitivity: moderate
  filter:
    - "verifyLogin"

- id: cyberpanel_login_success
  ground_truth_label: cyberpanel_login_success
  sensitivity: moderate
  filter:
    - "websiteFunctions"

- id: file_inclusion
  ground_truth_label: file_inclusion
  sensitivity: moderate
  filter:
    - "=http://"

- id: file_inclusion
  ground_truth_label: file_inclusion
  sensitivity: moderate
  filter:
    - "=https://"