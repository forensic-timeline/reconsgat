    - new session
    - dvwa

# Sudo Read passwd from Web Directory
- id: read_passwd
  ground_truth_label: read_passwd
  sensitivity: moderate
  filter:
    - "[sudo]"
    - var/www
    - bin/cat
    - /etc/passwd

