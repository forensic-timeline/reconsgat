# Labelling Rules untuk Ground Truth Dataset
# Format:
#   - filter: list of patterns (AND condition - semua pattern harus match)
#   - Pattern matching bersifat case-insensitive

# Dirb Scan
- id: dirb_scan
  ground_truth_label: dirb_scan
  sensitivity: moderate
  filter:
    - "Mozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.1)"
    - "192.168.115.21"

# brute force login
- id: brute_force_login
  ground_truth_label: brute_force_login
  sensitivity: moderate
  filter:
    - /dvwa/login.php
    - "python-requests/2.32.5"
    - "192.168.115.21"

# Upload Shell 1
- id: upload_rce_shell
  ground_truth_label: upload_rce_shell
  sensitivity: moderate
  filter:
    - login.php
    - Mozilla/5.0
    - "192.168.115.21"
# Upload Shell 2
- id: upload_rce_shell
  ground_truth_label: upload_rce_shell
  sensitivity: moderate
  filter:
    - vulnerabilities/upload/
    - Mozilla/5.0
    - "192.168.115.21"

