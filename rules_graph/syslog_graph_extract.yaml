# ============================================================
# syslog_graph_extract.yaml
# Extraction template untuk syslog (system log)
# Parser: text/syslog_traditional, filename: syslog/messages
# ============================================================

log_type: syslog
node_type: SystemEvent

# ── Deteksi file ─────────────────────────────────────────────
detect:
  filename_contains:
    - syslog
    - messages
    - kern.log
    - daemon.log
  parser_equals:
    - text/syslog_traditional
  filename_not_contains:
    - auth.log   # auth.log ditangani oleh auth_graph_extract.yaml
    - auth_log
  line_not_contains:
    - "New session"          # ditangani auth_graph_extract.yaml
    - "Failed password"      # SSH log, ditangani auth_graph_extract.yaml
    - "Accepted password"    # SSH log, ditangani auth_graph_extract.yaml
    - "Disconnected from"    # SSH log, ditangani auth_graph_extract.yaml
    - "Connection closed"    # SSH log, ditangani auth_graph_extract.yaml
    - "pam_unix"             # PAM log, ditangani auth_graph_extract.yaml

# ── Regex pattern untuk extract field ────────────────────────
patterns:
  service_pid:
    description: "Format: [service pid: N] message"
    regex: '\[(\w+)\s+pid:\s*(\d+)\]'
    fields:
      service: {group: 1}
      pid:     {group: 2, type: int}
    defaults:
      service: "unknown"
      pid:     0

  message_body:
    description: "Extract message body setelah bracket terakhir"
    regex: '\]\s*(.+)$'
    fields:
      message_parsed: {group: 1}
    defaults:
      message_parsed: ""

  username_from_message:
    description: "Extract username dari pola 'of user USERNAME' di akhir message"
    regex: 'of\s+user\s+(\w+)\.?$'
    fields:
      extracted_username: {group: 1}
    defaults:
      extracted_username: null

# ── Field tambahan ────────────────────────────────────────────
extra_fields:
  - event_id
  - label
  - severity
  - actor       # = extracted_username atau service
  - message     # = raw line
  - source_file
  - timestamp

# ── Cypher query templates ────────────────────────────────────
cypher:
  with_user:
    description: "SystemEvent dengan extracted username — buat User node"
    query: |
      MERGE (u:User {username: $username})
      ON CREATE SET u.first_seen = $timestamp, u.last_seen = $timestamp
      ON MATCH SET u.last_seen = $timestamp

      CREATE (sys:SystemEvent {
          event_id: $event_id,
          label: $label,
          severity: $severity,
          actor: $actor,
          source_file: $source_file,
          service: $service,
          pid: $pid,
          message: $message,
          timestamp: $timestamp
      })

      CREATE (u)-[:TRIGGERED]->(sys)

      RETURN u.username as user
    params:
      - event_id
      - label
      - severity
      - actor
      - source_file
      - username
      - service
      - pid
      - message
      - timestamp

  orphan:
    description: "SystemEvent tanpa username — node standalone"
    query: |
      CREATE (sys:SystemEvent {
          event_id: $event_id,
          label: $label,
          severity: $severity,
          actor: $actor,
          source_file: $source_file,
          service: $service,
          pid: $pid,
          message: $message,
          timestamp: $timestamp
      })

      RETURN sys.timestamp as created
    params:
      - event_id
      - label
      - severity
      - actor
      - source_file
      - service
      - pid
      - message
      - timestamp
