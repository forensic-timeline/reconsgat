title: Local File Inclusion
id: e2b53f2d-4c17-4b68-9b04-6a52f70a2c9a
status: test
description: Detects attempts to access sensitive Linux system files such as /etc/passwd, /etc/shadow, or /etc/group through HTTP requests.
author: Converted based on sample event
tags:
  - attack.credential-access
  - attack.t1003.008 #Technique induk: "OS Credential Dumping", Sub-technique: "/etc/passwd and /etc/shadow"
references:
  - https://attack.mitre.org/techniques/T1003/008/
logsource:
  category: webserver

detection:
  keywords:
    - '/etc/passwd'
    - '/etc/shadow'
    - '/etc/group'
  condition: keywords

falsepositives:
  - Security testing
  - Automated vulnerability scanning
level: high
