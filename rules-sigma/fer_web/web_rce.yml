title: Remote Code Execution
id: 9c4e8bd9-5aa1-42f5-b9f9-2fb3adfa6898
status: test
description: Detects use of suspicious RCE such as md5() in HTTP request parameters which may indicate exploitation attempts.
author: Converted based on sample event
tags:
  - attack.initial-access
  - attack.t1190 #eksploitasi kerentanan/bug
references:
  - https://attack.mitre.org/techniques/T1190/
logsource:
  category: webserver

detection:
  keywords:
    - 'md5('
    - 'sha1('
    # - 'sleep('
    # - 'benchmark('
    # - 'updatexml('
    # - 'extractvalue('
    - 'base64'
    - 'cmd='
    - 'command='
  condition: keywords

falsepositives:
  - Internal testing
  - Debug or development API functions
level: medium
