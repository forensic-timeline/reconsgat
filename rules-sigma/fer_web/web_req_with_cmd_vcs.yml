title: Version Control Commands in HTTP Request
id: 1af4b6ec-0b44-4b8e-bf7f-7a5f3c8b1c16
status: test
description: Detects decoded payloads in HTTP requests containing version control tool keywords such as git, svn, or hg, which may indicate webshell post-exploitation behavior.
author: Converted based on sample event
tags:
  - attack.execution
  - attack.t1059 #"Command and Scripting Interpreter"
references:
  - https://attack.mitre.org/techniques/T1059/
logsource:
  category: webserver

detection:
  keywords:
    - '"git'
    - '"svn'
    - '"hg'
  condition: keywords

falsepositives:
  - Forensic replay logs
  - Controlled pentesting environment
level: high
